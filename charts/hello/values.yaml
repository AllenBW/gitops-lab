# Chart defaults. Environments override these in envs/<env>/values.yaml.
# Rule of thumb: anything a tenant might reasonably change gets a value here,
# with a safe default, so adding it later doesn't break existing users.

replicaCount: 1

image:
  repository: ghcr.io/allenbw/hello
  tag: "latest"          # overridden per environment; never rely on latest
  pullPolicy: IfNotPresent

color: blue

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
