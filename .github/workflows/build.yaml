# On merge to main: build the image, push it to GHCR tagged with the commit SHA,
# then open a PR that bumps envs/dev/values.yaml. CI never touches the cluster.
# Argo CD sees the merged PR and deploys. That handoff is the CI -> GitOps seam.
name: build
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/hello" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          # Both architectures: kind on an Apple Silicon Mac runs arm64 nodes, GitHub runners are amd64.
          # The Dockerfile cross-compiles, so no QEMU is needed.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Bump dev image tag
        # yq comes preinstalled on GitHub-hosted Ubuntu runners.
        run: |
          yq -i '.image.tag = "${{ steps.meta.outputs.tag }}"' envs/dev/values.yaml

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: deploy/dev-${{ steps.meta.outputs.tag }}
          title: "deploy(dev): hello ${{ steps.meta.outputs.tag }}"
          commit-message: "deploy(dev): hello ${{ steps.meta.outputs.tag }}"
          body: |
            Automated image bump from commit ${{ github.sha }}.
            Merge to deploy to dev. Revert this PR to roll back.
          labels: deploy, automated
