# Runs on every PR. These checks are the "trust comes from the checks" part:
# they gate a human-written PR and an agent-written PR in exactly the same way.
name: ci
on:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go vet ./... && go test ./...
        working-directory: app

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/hello
      - name: Render every environment and validate against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for env in envs/*/; do
            echo "--- $env"
            helm template hello charts/hello -f "${env}values.yaml" | ./kubeconform -strict -summary
          done
